version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    groups:
      bun-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "web"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    groups:
      github-actions-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
