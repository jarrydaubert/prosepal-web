name: Monthly Governance Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/audit-*.js"
      - "scripts/validate-governance-token-expiry.js"
      - "docs/guides/OPS_RUNBOOK.md"
      - "SECURITY.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/audit-*.js"
      - "scripts/validate-governance-token-expiry.js"
      - "docs/guides/OPS_RUNBOOK.md"
      - "SECURITY.md"
  schedule:
    - cron: "20 7 1 * *"
    - cron: "20 7 * * 1"

concurrency:
  group: monthly-governance-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-audit:
    name: Governance Drift + CI Usage Budget
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Validate admin token secret
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -n "$GH_ADMIN_TOKEN" ]; then
            exit 0
          fi
          echo "::error::Missing GH_ADMIN_TOKEN secret. Add a fine-grained token with Administration (read) and Actions (read)."
          exit 1

      - name: Run GitHub policy drift audit
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: node scripts/audit-github-policy-drift.js

      - name: Validate governance token expiry horizon
        env:
          GH_ADMIN_TOKEN_EXPIRES_ON: ${{ vars.GH_ADMIN_TOKEN_EXPIRES_ON }}
          GH_ADMIN_TOKEN_MIN_DAYS: "30"
        run: node scripts/validate-governance-token-expiry.js

      - name: Run CI usage budget audit
        id: ci_usage_budget
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set +e
          node scripts/audit-ci-usage-budget.js
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print audit evidence
        if: always()
        run: |
          echo "---- github-policy-drift.md ----"
          cat docs/evidence/github-policy-drift.md
          echo "---- governance-token-expiry.md ----"
          cat docs/evidence/governance-token-expiry.md
          echo "---- ci-usage-budget.md ----"
          cat docs/evidence/ci-usage-budget.md

      - name: Enforce CI usage budget on authoritative audit runs
        if: steps.ci_usage_budget.outputs.exit_code != '0' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main')
        run: |
          echo "::error::CI usage budget audit failed. Review docs/evidence/ci-usage-budget.md."
          exit 1

      - name: Warn on CI usage budget overage during PR review loops
        if: steps.ci_usage_budget.outputs.exit_code != '0' && !(github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main')
        run: |
          echo "::warning::CI usage budget audit is over budget. Review docs/evidence/ci-usage-budget.md. Scheduled, manual, and push-to-main governance audits remain authoritative enforcement points."
