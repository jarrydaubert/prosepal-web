name: Monthly Governance Audit

# Manual / advisory only. This repo follows the lightweight web baseline:
# Repo health + CodeQL are the required checks; governance is advisory.
#
# Triggers are intentionally limited to workflow_dispatch:
#   - No `schedule`: scheduled runs created failure emails whenever the
#     GH_ADMIN_TOKEN PAT expired, turning governance into a recurring
#     maintenance burden.
#   - No `push`: avoids the same token-expiry failure when workflow/script
#     paths change on main.
#   - No `pull_request`: must never block or noise up ordinary PR work.
#
# PREREQUISITE for a meaningful manual run: a valid `GH_ADMIN_TOKEN` secret
# (fine-grained PAT with Administration: read + Actions: read) and the
# `GH_ADMIN_TOKEN_EXPIRES_ON` variable. Without it the run self-skips with
# guidance instead of failing.
on:
  workflow_dispatch:

concurrency:
  group: monthly-governance-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-audit:
    name: Governance Drift + CI Usage Budget
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Classify governance audit context
        id: audit_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          mode="full"
          reason="trusted-context"

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$ACTOR" = "dependabot[bot]" ]; then
            mode="skip-untrusted-pr"
            reason="dependabot-pull-request-has-no-actions-secrets"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_HEAD_REPO" != "$REPOSITORY" ]; then
            mode="skip-untrusted-pr"
            reason="fork-pull-request-has-no-actions-secrets"
          elif [ -z "$GH_ADMIN_TOKEN" ]; then
            mode="skip-missing-secret"
            reason="manual-run-missing-gh-admin-token"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Skip privileged governance audit on untrusted pull requests
        if: steps.audit_context.outputs.mode == 'skip-untrusted-pr'
        env:
          SKIP_REASON: ${{ steps.audit_context.outputs.reason }}
        run: |
          echo "::notice::Skipping privileged governance audit in this public PR context because $SKIP_REASON. Scheduled/manual audits and pushes to main remain authoritative."

      - name: Skip governance audit when admin token is absent
        if: steps.audit_context.outputs.mode == 'skip-missing-secret'
        run: |
          {
            echo "## Governance audit skipped (advisory, manual-only)"
            echo ""
            echo "This workflow is manual/advisory (workflow_dispatch only) and did not run the privileged audit because \`GH_ADMIN_TOKEN\` is not set."
            echo ""
            echo "**To run a full governance audit manually:**"
            echo "1. Create a fine-grained PAT for this repo with **Administration: read** and **Actions: read**."
            echo "2. \`gh secret set GH_ADMIN_TOKEN --repo \${{ github.repository }}\` (paste the token)."
            echo "3. \`gh variable set GH_ADMIN_TOKEN_EXPIRES_ON --repo \${{ github.repository }} --body <YYYY-MM-DD>\`."
            echo "4. Re-run this workflow via the Actions tab."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Governance audit skipped: GH_ADMIN_TOKEN not set. This is advisory only — see the run summary for manual-run setup. Exiting successfully."

      - name: Run GitHub policy drift audit
        if: steps.audit_context.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: node scripts/audit-github-policy-drift.js

      - name: Validate governance token expiry horizon
        if: steps.audit_context.outputs.mode == 'full'
        env:
          GH_ADMIN_TOKEN_EXPIRES_ON: ${{ vars.GH_ADMIN_TOKEN_EXPIRES_ON }}
          GH_ADMIN_TOKEN_MIN_DAYS: "30"
        run: node scripts/validate-governance-token-expiry.js

      - name: Run CI usage budget audit
        id: ci_usage_budget
        if: steps.audit_context.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          GH_CI_MONTHLY_MINUTES_REVIEW: ${{ vars.GH_CI_MONTHLY_MINUTES_REVIEW }}
          GH_CI_MONTHLY_MINUTES_MAX: ${{ vars.GH_CI_MONTHLY_MINUTES_MAX }}
          GH_CI_WEB_QUALITY_AVG_MINUTES_MAX: ${{ vars.GH_CI_WEB_QUALITY_AVG_MINUTES_MAX }}
          GH_CI_CODEQL_AVG_MINUTES_MAX: ${{ vars.GH_CI_CODEQL_AVG_MINUTES_MAX }}
        run: |
          set +e
          node scripts/audit-ci-usage-budget.js
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print audit evidence
        if: always() && steps.audit_context.outputs.mode == 'full'
        run: |
          echo "---- github-policy-drift.md ----"
          cat docs/evidence/github-policy-drift.md
          echo "---- governance-token-expiry.md ----"
          cat docs/evidence/governance-token-expiry.md
          echo "---- ci-usage-budget.md ----"
          cat docs/evidence/ci-usage-budget.md

      - name: Enforce CI usage budget on authoritative audit runs
        if: steps.audit_context.outputs.mode == 'full' && steps.ci_usage_budget.outputs.exit_code != '0' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          echo "::error::CI usage budget audit failed. Review docs/evidence/ci-usage-budget.md."
          exit 1

      - name: Warn on CI usage budget overage during PR and push review loops
        if: steps.audit_context.outputs.mode == 'full' && steps.ci_usage_budget.outputs.exit_code != '0' && !(github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          echo "::warning::CI usage budget audit is over budget. Review docs/evidence/ci-usage-budget.md. Scheduled and manual governance audits remain authoritative enforcement points."
