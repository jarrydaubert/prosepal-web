name: Visual Flake Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * 3"

concurrency:
  group: visual-flake-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-audit:
    name: Playwright Visual Flake Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461
        with:
          bun-version: "1.3.6"

      - name: Cache Bun package cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Run visual flake audit
        run: REPEAT_EACH=4 WORKERS=1 bun run test:visual:flake-audit

      - name: Upload visual flake audit artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: visual-flake-audit-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/prosepal-web-visual-flake-audit
            test-results
            playwright-report
