name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Lockfile policy guard
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bun.lock ]; then
            echo "::error::Missing bun.lock. Commit the Bun lockfile."
            exit 1
          fi
          for f in package-lock.json yarn.lock pnpm-lock.yaml bun.lockb; do
            if [ -f "$f" ]; then
              echo "::error::Disallowed lockfile present: $f"
              exit 1
            fi
          done

      - name: Tracked env guard
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env .env.local .env.production 2>/dev/null; then
            echo "An env file is tracked in git. Move secrets to provider env vars."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check site
        run: bun run check
