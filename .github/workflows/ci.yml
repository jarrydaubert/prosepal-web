name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-health:
    name: Repo health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Lockfile policy guard
        shell: bash
        run: |
          set -euo pipefail
          for f in package-lock.json yarn.lock pnpm-lock.yaml bun.lockb; do
            if [ -f "$f" ]; then
              echo "Disallowed lockfile present: $f"
              exit 1
            fi
          done

      - name: Tracked env guard
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env .env.local .env.production 2>/dev/null; then
            echo "An env file is tracked in git. Move secrets to provider env vars."
            exit 1
          fi
          exit 0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repo checks
        run: bun run check:repo

      - name: Build
        run: bun run build
