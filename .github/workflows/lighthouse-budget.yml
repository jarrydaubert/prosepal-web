name: Lighthouse Budget

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "scripts/**"
      - "templates/**"
      - "data/**"
      - "package.json"
      - "bun.lock"
      - "vercel.json"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse-budget.yml"

concurrency:
  group: lighthouse-budget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.6"

      - name: Cache Bun package cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate static artifacts
        run: bun run generate:site

      - name: Install Lighthouse CI CLI
        run: npm install -g @lhci/cli@0.15.1

      - name: Run Lighthouse budget assertions
        run: lhci autorun --config=.lighthouserc.json
