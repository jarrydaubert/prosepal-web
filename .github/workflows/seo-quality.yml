name: SEO Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  seo-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run SEO and quality checks
        run: bun run check

      - name: Ensure generated SEO artifacts are committed
        run: |
          git diff --exit-code -- \
            public/messages \
            public/sitemap.xml \
            public/robots.txt \
            public/llms.txt
