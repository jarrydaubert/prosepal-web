name: Web Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "public/**"
      - "scripts/**"
      - "templates/**"
      - "data/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "vercel.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/seo-quality.yml"
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "scripts/**"
      - "templates/**"
      - "data/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "vercel.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/seo-quality.yml"

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-checks:
    name: SEO + QA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run SEO and quality checks
        run: bun run check

      - name: Ensure generated SEO artifacts are committed
        run: |
          git diff --exit-code -- \
            public/messages \
            public/sitemap.xml \
            public/robots.txt \
            public/llms.txt
