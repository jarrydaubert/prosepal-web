name: Web Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "public/**"
      - "scripts/**"
      - "templates/**"
      - "data/**"
      - "tests/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "playwright.interaction.config.js"
      - "vercel.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - ".github/**"
      - ".github/workflows/seo-quality.yml"
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "scripts/**"
      - "templates/**"
      - "data/**"
      - "tests/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "playwright.interaction.config.js"
      - "vercel.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - ".github/**"
      - ".github/workflows/seo-quality.yml"

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-checks:
    name: SEO + QA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.6"

      - name: Cache Bun package cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Run SEO and quality checks
        run: bun run check

      - name: Ensure generated SEO artifacts are committed
        run: |
          git diff --exit-code -- \
            public/messages \
            public/sitemap.xml \
            public/robots.txt \
            public/llms.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: web-quality-failure-artifacts
          if-no-files-found: ignore
          path: |
            /tmp/prosepal-playwright-interaction-results
            docs/evidence
