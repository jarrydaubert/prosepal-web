name: Visual Regression

on:
  workflow_dispatch:
    inputs:
      intentional_diff:
        description: "Set true to force an intentional visual diff for evidence collection."
        required: false
        default: "false"
  pull_request:
    paths:
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "playwright.visual.config.js"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/visual-regression.yml"

concurrency:
  group: visual-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.6"

      - name: Cache Bun package cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Run baseline visual regression
        env:
          FORCE_VISUAL_DIFF: ${{ github.event.inputs.intentional_diff == 'true' && '1' || '0' }}
        run: bun run test:visual

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: visual-regression-artifacts
          path: |
            test-results
            playwright-report
