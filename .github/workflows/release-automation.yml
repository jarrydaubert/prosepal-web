name: Release Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "scripts/**"
      - "templates/**"
      - "data/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "vercel.json"
      - ".github/workflows/release-automation.yml"
      - ".release-please-config.json"
      - ".release-please-manifest.json"

concurrency:
  group: release-automation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarize release automation result
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          printf 'release_created=%s\n' "$RELEASE_CREATED"
          printf 'release_tag=%s\n' "$RELEASE_TAG"
          printf 'release_url=%s\n' "$RELEASE_URL"
          printf 'prs_created=%s\n' "$PRS_CREATED"
          printf 'pr=%s\n' "$RELEASE_PR"
