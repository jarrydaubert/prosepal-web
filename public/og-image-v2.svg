<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="96" y1="48" x2="1110" y2="602" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#222E3D"/>
      <stop offset="0.55" stop-color="#1D2633"/>
      <stop offset="1" stop-color="#151C26"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(366 184) rotate(22.8) scale(402 266)">
      <stop stop-color="#D4736B" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#D4736B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(921 138) rotate(120.2) scale(203 176)">
      <stop stop-color="#FBBF24" stop-opacity="0.24"/>
