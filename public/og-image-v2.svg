  <rect x="318" y="510" width="188" height="50" rx="25" fill="#FFF4EB" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="346" y="542" fill="#FFF7F5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">30-second flow</text>

  <rect x="524" y="510" width="216" height="50" rx="25" fill="#FFF4EB" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="552" y="542" fill="#FFF7F5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">Birthday to sympathy</text>

