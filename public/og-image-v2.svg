    <text x="755" y="241" fill="#A5564F" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700">Option 1</text>
    <rect x="734" y="264" width="277" height="12" rx="6" fill="#D4736B" fill-opacity="0.88"/>
