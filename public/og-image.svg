<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F3EDF7"/>
      <stop offset="100%" style="stop-color:#EADDFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6750A4"/>
      <stop offset="100%" style="stop-color:#7C5DCA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circle -->
  <circle cx="1050" cy="100" r="200" fill="#6750A4" opacity="0.1"/>
  <circle cx="150" cy="530" r="150" fill="#6750A4" opacity="0.08"/>

  <!-- Logo placeholder (replace with actual logo) -->
  <circle cx="100" cy="80" r="40" fill="#6750A4"/>
  <text x="155" y="92" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#1C1B1F">Prosepal</text>

  <!-- Main headline -->
  <text x="100" y="280" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#1C1B1F">Never stare at a</text>
  <text x="100" y="370" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#6750A4">blank card again</text>

  <!-- Tagline -->
  <text x="100" y="450" font-family="Inter, -apple-system, sans-serif" font-size="28" fill="#49454F">Get 3 heartfelt messages in 30 seconds - free</text>

  <!-- Badge -->
  <rect x="100" y="500" width="300" height="50" rx="25" fill="#6750A4"/>
  <text x="250" y="533" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">AI Card Message Generator</text>

  <!-- App preview mockup (simplified) -->
  <rect x="750" y="150" width="350" height="380" rx="24" fill="white" filter="drop-shadow(0 4px 20px rgba(0,0,0,0.1))"/>
  <rect x="765" y="170" width="320" height="60" rx="12" fill="#F3EDF7"/>
  <text x="925" y="208" font-family="Inter, sans-serif" font-size="16" fill="#49454F" text-anchor="middle">Birthday - Best Friend</text>
  <rect x="765" y="250" width="320" height="260" rx="12" fill="#EADDFF"/>
  <text x="780" y="290" font-family="Inter, sans-serif" font-size="14" fill="#21005D" font-style="italic">"Thirty looks incredible</text>
  <text x="780" y="315" font-family="Inter, sans-serif" font-size="14" fill="#21005D" font-style="italic">on you. Here's to three</text>
  <text x="780" y="340" font-family="Inter, sans-serif" font-size="14" fill="#21005D" font-style="italic">decades of chasing</text>
  <text x="780" y="365" font-family="Inter, sans-serif" font-size="14" fill="#6750A4" font-weight="600" font-style="italic">horizons..."</text>
</svg>
